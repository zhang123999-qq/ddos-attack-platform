events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # 访问日志格式 (便于分析)
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'rt=$request_time uct="$upstream_connect_time" '
                    'uht="$upstream_header_time" urt="$upstream_response_time"';

    access_log  /var/log/nginx/access.log  main;
    error_log   /var/log/nginx/error.log warn;

    # 基础性能优化
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # 缓冲区设置 (防 Slowloris)
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    client_max_body_size 8m;
    large_client_header_buffers 4 8k;

    # 超时设置 (防 Slowloris)
    client_header_timeout 10s;
    client_body_timeout 10s;
    send_timeout 10s;

    # Gzip
    gzip  on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    # 默认服务器
    server {
        listen       80;
        server_name  localhost;

        # 根路径
        location / {
            root   /usr/share/nginx/html;
            index  index.html index.htm;
        }

        # 测试端点
        location /api/test {
            return 200 '{"status":"ok","timestamp":"$time_iso8601","remote_addr":"$remote_addr"}\n';
            add_header Content-Type application/json;
        }

        # 模拟慢速端点 (用于测试 Slowloris 防御)
        # 说明: Slowloris 通过发送不完整请求头耗尽连接, 与端点本身无关;
        # 此处提供标准指令实现的延迟语义 (限速下载), 不依赖第三方 echo 模块。
        # 原配置的 echo_sleep/echo_duplicate 在官方 nginx:alpine 中不存在, 会导致启动失败。
        location /slow {
            root /usr/share/nginx/html;
            try_files /slow.html =404;
            limit_rate 512;   # 512 B/s — 人为拉长响应时间
        }

        # 模拟大响应 (用于测试带宽消耗)
        # large.bin (10MB) 由 docker-entrypoint.d 脚本在容器启动时生成
        location /large {
            alias /usr/share/nginx/html/large.bin;
            limit_rate 4m;    # 限速 4MB/s, 拉长传输便于观测
        }

        # 状态页
        location /nginx_status {
            stub_status on;
            allow 10.100.0.0/16;
            allow 192.168.0.0/16;
            deny all;
        }

        # 健康检查
        location /health {
            return 200 'healthy\n';
            add_header Content-Type text/plain;
        }

        # 错误页
        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   /usr/share/nginx/html;
        }
    }
}