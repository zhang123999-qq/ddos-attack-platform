name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# C-5 加固: 全局最小权限, 各 job 按需放大
permissions:
  contents: read

jobs:
  # 测试门禁: pytest 不过则不进入构建发布
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r controller/requirements.txt
          pip install --no-cache-dir -r attacker/requirements.txt
          pip install --no-cache-dir pytest httpx aiohttp cryptography

      # v1.5.0 (T-NEW-4): ruff lint 门禁
      - name: Install ruff
        run: pip install --no-cache-dir 'ruff==0.6.5'

      - name: Ruff lint
        run: |
          ruff check controller/ attacker/ build/
          ruff format --check controller/ attacker/ build/

      # v1.5.0 (O-NEW-2): secrets 扫描 (gitleaks) - 防止 SHARED_SECRET/CA 私钥误提交
      - name: Detect secrets (gitleaks)
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # v1.5.0 (O-NEW-2): pip-audit 已知 CVE 扫描
      - name: Dependency audit (pip-audit)
        run: |
          pip install --no-cache-dir pip-audit
          pip-audit -r controller/requirements.txt -r attacker/requirements.txt || echo "::warning::CVE found (non-blocking)"

      # v1.5.0 (C.4): Linux NetworkNamespace 隔离 E2E (需 unshare, 失败不影响门禁)
      - name: NetworkNamespace E2E (Linux only)
        run: |
          if command -v unshare >/dev/null 2>&1; then
            python -m pytest controller/tests/test_e2e_network_namespace.py -v -m network_isolation || echo "::warning::netns E2E failed (CI Linux only)"
          else
            echo "SKIP: unshare not available"
          fi

      # v1.4.1-hotfix6 (NEW-1): TD-1 fail-closed 需要测试显式 opt-out 走 HTTP
      # (CI 环境无 Node 实际连接, 否则 NodeCommander 启动崩溃, pytest 失败)
      - name: Run controller test suite (gate)
        working-directory: controller
        env:
          SHARED_SECRET: ci-gate-secret-32chars-abcdef1234567890
          LOG_LEVEL: error
          ENABLE_WEB_UI: 'true'
          # NEW-1 (r3): TD-1 fail-closed 兼容
          NODE_INSECURE_PLAIN_HTTP: 'true'
          NODE_PLAIN_HTTP_BANNED: 'false'
        # NEW-2 (r3): 跑全部 tests/, 不再是 4/11 漏 5 个 (含 install_hardening/node_commander_tls/upgrade_path_regression/registry_fixes/weak_modules)
        run: |
          python -m pytest tests/ -v --tb=short

      # NEW-3 (r3): 跑 attacker 测试套件
      - name: Run attacker test suite (NEW-3)
        working-directory: attacker
        run: |
          python -m pytest tests/ -v --tb=short

      - name: Run E2E flows (real HTTPS boots)
        working-directory: controller
        env:
          SHARED_SECRET: ci-gate-secret-32chars-abcdef1234567890
        run: |
          python tests/test_install_flow_e2e.py
          python tests/test_tls_e2e.py

  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [controller, attacker-http, attacker-raw]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          # context 提升为仓库根: controller 镜像可打包 deploy/node-install.sh 供 /install.sh 分发
          context: .
          file: ./${{ matrix.service == 'controller' && 'controller/Dockerfile' || (matrix.service == 'attacker-raw' && 'attacker/Dockerfile.raw' || 'attacker/Dockerfile') }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # C-5 修复: 缓存按 ref + service 隔离, 阻断跨分支缓存投毒路径
          cache-from: type=gha,scope=build-${{ matrix.service }}-${{ github.ref }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.service }}-${{ github.ref }}
          build-args: |
            SERVICE_TYPE=${{ matrix.service }}