name: Docker Build & Publish

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

# C-5 加固: 全局最小权限, 各 job 按需放大
permissions:
  contents: read

jobs:
  # 测试门禁: pytest 不过则不进入构建发布
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install --no-cache-dir -r controller/requirements.txt
          pip install --no-cache-dir pytest httpx

      - name: Run controller test suite (gate)
        working-directory: controller
        env:
          SHARED_SECRET: ci-gate-secret-32chars-abcdef1234567890
          LOG_LEVEL: error
          ENABLE_WEB_UI: 'true'
        run: |
          python -m pytest tests/test_ratelimit.py tests/test_scenarios.py \
            tests/test_enroll.py tests/test_api_smoke.py -v --tb=short

      - name: Run E2E flows (real HTTPS boots)
        working-directory: controller
        env:
          SHARED_SECRET: ci-gate-secret-32chars-abcdef1234567890
        run: |
          python tests/test_install_flow_e2e.py
          python tests/test_tls_e2e.py

  build-and-push:
    needs: [test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        service: [controller, attacker-http, attacker-raw]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}/${{ matrix.service }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=,format=short

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v5
        with:
          # context 提升为仓库根: controller 镜像可打包 deploy/node-install.sh 供 /install.sh 分发
          context: .
          file: ./${{ matrix.service == 'controller' && 'controller/Dockerfile' || (matrix.service == 'attacker-raw' && 'attacker/Dockerfile.raw' || 'attacker/Dockerfile') }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # C-5 修复: 缓存按 ref + service 隔离, 阻断跨分支缓存投毒路径
          cache-from: type=gha,scope=build-${{ matrix.service }}-${{ github.ref }}
          cache-to: type=gha,mode=max,scope=build-${{ matrix.service }}-${{ github.ref }}
          build-args: |
            SERVICE_TYPE=${{ matrix.service }}