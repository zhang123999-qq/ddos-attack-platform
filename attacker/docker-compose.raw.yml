version: '3.8'

services:
  attacker-raw:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ddos-attacker-raw
    restart: unless-stopped
    # RAW 攻击需要特权
    privileged: true
    # 或者使用细粒度 capability
    # cap_add:
    #   - NET_RAW
    #   - NET_ADMIN
    # network_mode: "host"  # 如果需要发送伪造源 IP 包，可能需要 host 网络
    environment:
      - NODE_ID=${NODE_ID:-attacker-raw-01}
      - NODE_TYPE=raw
      - NODE_LABELS=${NODE_LABELS:-role=raw-attacker,zone=dmz}
      - CONTROLLER_URL=${CONTROLLER_URL:-https://10.100.1.10:8443}
      - CONTROLLER_CA_CERT=/certs/ca-cert.pem
      - NODE_CERT=/certs/node-cert.pem
      - NODE_KEY=/certs/node-key.pem
      - NODE_TOKEN=${NODE_TOKEN}
      - SHARED_SECRET=${SHARED_SECRET}
      - ATTACK_TYPES=syn_flood,udp_flood,udp_reflection
      - MAX_PPS=${MAX_PPS:-50000}
      - MAX_CONCURRENT=${MAX_CONCURRENT:-1000}
      - NETWORK_INTERFACE=${NETWORK_INTERFACE:-eth0}
      - HEARTBEAT_INTERVAL=10
      - ALLOWED_TARGET_CIDRS=${ALLOWED_TARGET_CIDRS:-10.100.0.0/16,192.168.0.0/16}
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - ./certs:/certs:ro
      - attacker-raw-logs:/var/log/ddos-attacker
    ports:
      - "8080:8080"
    networks:
      - ddos-lab
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

volumes:
  attacker-raw-logs:

networks:
  ddos-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.1.0/24