version: '3.8'

# 单机测试用全栈启动
# 生产环境请使用各模块独立 docker-compose.yml 部署到不同机器

services:
  # ========== Controller ==========
  controller:
    build:
      context: .
      dockerfile: controller/Dockerfile
    container_name: ddos-controller
    restart: unless-stopped
    environment:
      - CONTROLLER_IP=10.100.1.10
      - CONTROLLER_PORT=8443
      - CONTROLLER_HOST=0.0.0.0
      # v1.4.0 (TD-2 修复): docker-compose 弱默认 fallback 移除
      # 启动前必须在 .env 设置 SHARED_SECRET=<至少 32 字符的强随机密钥>
      # 未设置时容器直接退出, 避免带弱密钥的"看似正常"部署
      - SHARED_SECRET=${SHARED_SECRET:?SHARED_SECRET must be set in .env (>=32 chars, e.g. openssl rand -hex 32)}
      - REQUIRE_SHARED_SECRET=true
      - TLS_CERT_FILE=/certs/controller-cert.pem
      - TLS_KEY_FILE=/certs/controller-key.pem
      - TLS_CA_FILE=/certs/ca-cert.pem
      # v1.3.0 起目标白名单不再技术强制 (仅作为节点环境变量兼容保留);
      # 目标约束转为流程管控: 授权书 + SAFETY_RULES 红线
      - ALLOWED_TARGET_CIDRS=10.100.0.0/16,192.168.0.0/16,172.16.0.0/12
      - GLOBAL_MAX_RPS=50000
      - GLOBAL_MAX_PPS=100000
      - GLOBAL_MAX_CONCURRENT_CONNECTIONS=100000
      - AUDIT_FILE_ENABLED=false
      - ENABLE_WEB_UI=true
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - ./controller/certs:/certs:ro
      - controller-logs:/var/log/ddos-audit
      - ./scenarios:/app/scenarios:ro
      # 一键安装分发: 节点安装脚本 + 攻击节点二进制制品 (放入 *.tar.gz 即可)
      - ./deploy/node-install.sh:/app/deploy/node-install.sh:ro
      - ./artifacts:/app/artifacts
    ports:
      - "8443:8443"
    networks:
      - ddos-lab
    healthcheck:
      # python 实现 (镜像未装 curl; -k 语义 = 跳过自签证书校验)
      test: ["CMD", "python", "-c", "import ssl,urllib.request as u; c=ssl.create_default_context(); c.check_hostname=False; c.verify_mode=ssl.CERT_NONE; u.urlopen('https://localhost:8443/health', context=c, timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ========== Attacker HTTP (普通权限) ==========
  attacker-http:
    build:
      context: .
      dockerfile: attacker/Dockerfile
    container_name: ddos-attacker-http
    restart: unless-stopped
    environment:
      - NODE_ID=attacker-http-01
      - NODE_TYPE=http
      - NODE_LABELS=role=http-attacker,zone=local
      - CONTROLLER_URL=https://controller:8443
      - CONTROLLER_CA_CERT=/certs/ca-cert.pem
      - NODE_CERT=/certs/node-cert.pem
      - NODE_KEY=/certs/node-key.pem
      - NODE_TOKEN=
      - SHARED_SECRET=${SHARED_SECRET:?SHARED_SECRET must be set in .env (>=32 chars, e.g. openssl rand -hex 32)}
      - REQUIRE_SHARED_SECRET=true
      - ATTACK_TYPES=http_flood,slowloris
      - MAX_RPS=10000
      - MAX_CONCURRENT=5000
      - HEARTBEAT_INTERVAL=10
      - ALLOWED_TARGET_CIDRS=10.100.0.0/16,192.168.0.0/16,172.16.0.0/12
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - ./attacker/certs:/certs:ro
      - attacker-http-logs:/var/log/ddos-attacker
    ports:
      - "8080:8080"
    networks:
      - ddos-lab
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ========== Attacker RAW (需 CAP_NET_RAW，用于 SYN/UDP) ==========
  attacker-raw:
    build:
      context: .
      dockerfile: attacker/Dockerfile.raw
    container_name: ddos-attacker-raw
    restart: unless-stopped
    # 最小权限: 仅授予原始套接字/网络管理 capability (v1.3.2 审计修复,
    # 原先 privileged: true 等价于宿主机 root, 违背最小权限原则)
    cap_add:
      - NET_RAW
      - NET_ADMIN
    environment:
      - NODE_ID=attacker-raw-01
      - NODE_TYPE=raw
      - NODE_LABELS=role=raw-attacker,zone=local
      - CONTROLLER_URL=https://controller:8443
      - CONTROLLER_CA_CERT=/certs/ca-cert.pem
      - NODE_CERT=/certs/node-cert.pem
      - NODE_KEY=/certs/node-key.pem
      - NODE_TOKEN=
      - SHARED_SECRET=${SHARED_SECRET:?SHARED_SECRET must be set in .env (>=32 chars, e.g. openssl rand -hex 32)}
      - REQUIRE_SHARED_SECRET=true
      - ATTACK_TYPES=syn_flood,udp_flood,udp_reflection
      - MAX_PPS=50000
      - MAX_CONCURRENT=1000
      - NETWORK_INTERFACE=eth0
      - HEARTBEAT_INTERVAL=10
      - ALLOWED_TARGET_CIDRS=10.100.0.0/16,192.168.0.0/16,172.16.0.0/12
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
    volumes:
      - ./attacker/certs:/certs:ro
      - attacker-raw-logs:/var/log/ddos-attacker
    ports:
      - "8081:8080"
    networks:
      - ddos-lab
    depends_on:
      controller:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # ========== 简易靶机 (用于功能验证) ==========
  target-app:
    image: nginx:alpine
    container_name: ddos-target-app
    restart: unless-stopped
    ports:
      - "80:80"
    networks:
      - ddos-lab
    volumes:
      - ./target/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./target/generate-test-files.sh:/docker-entrypoint.d/90-generate-test-files.sh:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost/"]
      interval: 10s
      timeout: 5s
      retries: 3

  # ========== 监控栈 (可选) ==========
  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: ddos-prometheus
    restart: unless-stopped
    volumes:
      - ./monitor/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - ddos-lab
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'

  grafana:
    image: grafana/grafana:10.2.2
    container_name: ddos-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      # S-6 修复: 弱默认口令不再硬编码, 部署时通过环境变量注入
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Set GRAFANA_ADMIN_PASSWORD in .env or environment}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitor/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitor/grafana/datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "3000:3000"
    networks:
      - ddos-lab
    depends_on:
      - prometheus

volumes:
  controller-logs:
  attacker-http-logs:
  attacker-raw-logs:
  prometheus-data:
  grafana-data:

networks:
  ddos-lab:
    driver: bridge
    ipam:
      config:
        - subnet: 10.100.1.0/24