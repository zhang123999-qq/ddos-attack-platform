# =============================================================================
# 生产部署 — Attacker HTTP 节点 (每台机器部署一个)
# 用法:
#   docker compose -f docker-compose.attacker.yml up -d
# =============================================================================

version: '3.8'

services:
  attacker-http:
    image: ghcr.io/your-org/ddos-attack-platform/attacker-http:latest
    container_name: ddos-attacker-http
    restart: unless-stopped
    environment:
      - NODE_ID=${NODE_ID:?NODE_ID is required}
      - NODE_TYPE=http
      - NODE_LABELS=${NODE_LABELS:-role=http-attacker}
      - CONTROLLER_URL=${CONTROLLER_URL:?CONTROLLER_URL is required}
      - CONTROLLER_CA_CERT=/certs/ca-cert.pem
      - NODE_CERT=/certs/node-cert.pem
      - NODE_KEY=/certs/node-key.pem
      - NODE_TOKEN=${NODE_TOKEN:-}
      - SHARED_SECRET=${SHARED_SECRET:?SHARED_SECRET is required}
      - REQUIRE_SHARED_SECRET=true
      - ATTACK_TYPES=${ATTACK_TYPES:-http_flood,slowloris}
      - MAX_RPS=${MAX_RPS:-10000}
      - MAX_CONCURRENT=${MAX_CONCURRENT:-5000}
      - HEARTBEAT_INTERVAL=10
      - ALLOWED_TARGET_CIDRS=${ALLOWED_TARGET_CIDRS:-10.100.0.0/16}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ${CERTS_DIR:-./certs}:/certs:ro
    ports:
      - "8080:8080"
    networks:
      - ddos-lab
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8080/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  ddos-lab:
    driver: bridge