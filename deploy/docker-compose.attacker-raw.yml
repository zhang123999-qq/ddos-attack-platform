# =============================================================================
# 生产部署 — Attacker RAW 节点 (SYN/UDP 攻击，需特权)
# 用法:
#   docker compose -f docker-compose.attacker-raw.yml up -d
# =============================================================================

version: '3.8'

services:
  attacker-raw:
    image: ghcr.io/your-org/ddos-attack-platform/attacker-raw:latest
    container_name: ddos-attacker-raw
    restart: unless-stopped
    privileged: true
    environment:
      - NODE_ID=${NODE_ID:?NODE_ID is required}
      - NODE_TYPE=raw
      - NODE_LABELS=${NODE_LABELS:-role=raw-attacker}
      - CONTROLLER_URL=${CONTROLLER_URL:?CONTROLLER_URL is required}
      - CONTROLLER_CA_CERT=/certs/ca-cert.pem
      - NODE_CERT=/certs/node-cert.pem
      - NODE_KEY=/certs/node-key.pem
      - NODE_TOKEN=${NODE_TOKEN:-}
      - SHARED_SECRET=${SHARED_SECRET:?SHARED_SECRET is required}
      - ATTACK_TYPES=${ATTACK_TYPES:-syn_flood,udp_flood,udp_reflection}
      - MAX_PPS=${MAX_PPS:-50000}
      - MAX_CONCURRENT=${MAX_CONCURRENT:-1000}
      - NETWORK_INTERFACE=${NETWORK_INTERFACE:-eth0}
      - HEARTBEAT_INTERVAL=10
      - ALLOWED_TARGET_CIDRS=${ALLOWED_TARGET_CIDRS:-10.100.0.0/16}
      - LOG_LEVEL=${LOG_LEVEL:-INFO}
    volumes:
      - ${CERTS_DIR:-./certs}:/certs:ro
    ports:
      - "8080:8080"
    networks:
      - ddos-lab
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  ddos-lab:
    driver: bridge